# Generates app/Etale.xcodeproj: `cd cases/etale-ios && xcodegen generate --spec project.yml --project app`
# (XcodeGen 2.44 or later). The generated project is committed, so neither a run nor a rebuild needs XcodeGen.
# The settings are those of a new Xcode 26 iOS App template; Etale/ is a folder Xcode keeps in sync with the
# disk, so a Swift file added to it is compiled without editing the project.
name: Etale
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    SWIFT_UPCOMING_FEATURE_MEMBER_IMPORT_VISIBILITY: YES
targets:
  Etale:
    type: application
    platform: iOS
    sources:
      - path: Etale
        type: syncedFolder
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.etale
        PRODUCT_NAME: Etale
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Étale
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
