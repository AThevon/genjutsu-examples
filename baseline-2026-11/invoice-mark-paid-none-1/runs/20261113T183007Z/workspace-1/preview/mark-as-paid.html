<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Preview: Mark as paid - Folio</title>
<style>
/* Copied from src/index.css so the preview matches the app. */
*,
*::before,
*::after {
  box-sizing: border-box;
}

:root {
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color: #1f2328;
  background: #f6f7f9;
  line-height: 1.5;
}

body {
  margin: 0;
}

a {
  color: inherit;
}

button {
  font: inherit;
  cursor: pointer;
  border: 1px solid #1f2328;
  background: #1f2328;
  color: #fff;
  border-radius: 6px;
  padding: 0.35rem 0.75rem;
  font-size: 0.875rem;
}

button.secondary {
  background: #fff;
  color: #1f2328;
}

.visually-hidden {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 2rem;
  padding: 0.75rem 2rem;
  background: #fff;
  border-bottom: 1px solid #e3e5e8;
}

.brand {
  font-weight: 700;
  font-size: 1.125rem;
}

.topbar nav {
  display: flex;
  gap: 1.25rem;
  font-size: 0.9375rem;
}

.topbar nav a {
  text-decoration: none;
  color: #59636e;
}

.topbar nav a[aria-current="page"] {
  color: #1f2328;
  font-weight: 600;
}

.page {
  max-width: 1120px;
  margin: 0 auto;
  padding: 2rem;
}

.page-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.page-head h1 {
  margin: 0;
  font-size: 1.5rem;
}

.summary {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 1rem;
  margin: 1.5rem 0;
}

.summary div {
  background: #fff;
  border: 1px solid #e3e5e8;
  border-radius: 8px;
  padding: 1rem 1.25rem;
}

.summary dt {
  color: #59636e;
  font-size: 0.875rem;
}

.summary dd {
  margin: 0.25rem 0 0;
  font-size: 1.375rem;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

.invoices {
  width: 100%;
  border-collapse: collapse;
  background: #fff;
  border: 1px solid #e3e5e8;
  border-radius: 8px;
  font-size: 0.9375rem;
}

.invoices th,
.invoices td {
  text-align: left;
  padding: 0.75rem 1rem;
  border-bottom: 1px solid #eef0f2;
}

.invoices th {
  color: #59636e;
  font-weight: 500;
  font-size: 0.8125rem;
}

.invoices tbody tr:last-child td {
  border-bottom: none;
}

.num {
  text-align: right !important;
  font-variant-numeric: tabular-nums;
}

.mono {
  font-family: ui-monospace, "SF Mono", Menlo, monospace;
  font-size: 0.8125rem;
}

.muted {
  color: #59636e;
}

.actions {
  text-align: right !important;
  width: 9rem;
}

.status {
  display: inline-block;
  padding: 0.125rem 0.5rem;
  border-radius: 999px;
  font-size: 0.8125rem;
  font-weight: 500;
}

.status-draft {
  background: #eef0f2;
  color: #59636e;
}

.status-sent {
  background: #e7f0fe;
  color: #1d4ed8;
}

.status-overdue {
  background: #fdecec;
  color: #b42318;
}

.status-paid {
  background: #e6f4ea;
  color: #1a7f37;
}

/* ---- Mark as paid: the money landing ---- */

button.link {
  border: none;
  background: none;
  color: #1f2328;
  padding: 0.35rem 0.25rem;
  text-decoration: underline;
  text-underline-offset: 2px;
}

button:focus-visible {
  outline: 2px solid #1d4ed8;
  outline-offset: 2px;
}

.status {
  display: inline-flex;
  align-items: center;
  gap: 0.25rem;
}

.status-icon {
  width: 0.75rem;
  height: 0.75rem;
  flex: none;
}

.undo-offer {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.8125rem;
  white-space: nowrap;
}

.undo-note {
  color: #1a7f37;
}

/* The row takes the green of the Paid pill, then lets it go. */
.just-paid td {
  animation: paid-wash 1.6s cubic-bezier(0.16, 1, 0.3, 1) both;
}

.just-paid .amount {
  animation:
    paid-wash 1.6s cubic-bezier(0.16, 1, 0.3, 1) both,
    paid-ink 1.6s ease-out both;
}

@keyframes paid-wash {
  from {
    background-color: #e6f4ea;
  }
  to {
    background-color: transparent;
  }
}

@keyframes paid-ink {
  0%,
  40% {
    color: #1a7f37;
  }
  100% {
    color: inherit;
  }
}

.summary-paid {
  position: relative;
}

.summary dd {
  display: flex;
  align-items: baseline;
  gap: 0.5rem;
}

.landed-delta {
  font-size: 0.875rem;
  font-weight: 600;
  color: #1a7f37;
}

/* A single soft ring on the Paid card, timed to arrive with the count. */
.summary-glow {
  position: absolute;
  inset: -1px;
  border-radius: inherit;
  pointer-events: none;
  animation: paid-glow 1.4s ease-out 0.15s both;
}

@keyframes paid-glow {
  0% {
    box-shadow: 0 0 0 0 rgba(26, 127, 55, 0);
    border: 1px solid rgba(26, 127, 55, 0);
  }
  20% {
    box-shadow: 0 0 0 4px rgba(26, 127, 55, 0.14);
    border: 1px solid rgba(26, 127, 55, 0.55);
  }
  100% {
    box-shadow: 0 0 0 0 rgba(26, 127, 55, 0);
    border: 1px solid rgba(26, 127, 55, 0);
  }
}

@media (prefers-reduced-motion: reduce) {
  .just-paid td,
  .just-paid .amount {
    animation-duration: 1.2s;
  }
  .summary-glow {
    animation: none;
  }
}


/* Preview-only chrome */
.preview-bar { display:flex; gap:1rem; align-items:center; padding:.5rem 2rem; background:#fffbe6; border-bottom:1px solid #f0e2a8; font-size:.8125rem; color:#59636e; }
.preview-bar label { display:inline-flex; gap:.35rem; align-items:center; }
.preview-bar button { font-size:.8125rem; }
.pill-in { animation: pill-in .32s cubic-bezier(.34,1.56,.64,1) both; }
@keyframes pill-in { from { opacity:0; transform:scale(.85);} to { opacity:1; transform:scale(1);} }
.check-path { stroke-dasharray: 20; stroke-dashoffset: 20; animation: draw .32s cubic-bezier(.65,0,.35,1) .12s forwards; }
@keyframes draw { to { stroke-dashoffset: 0; } }
.fade-in { animation: fade .2s ease-out .25s both; }
.delta-in { animation: delta .3s cubic-bezier(.16,1,.3,1) .15s both; }
@keyframes fade { from { opacity:0 } to { opacity:1 } }
@keyframes delta { from { opacity:0; transform:translateY(6px);} to { opacity:1; transform:none;} }
button:active { transform: scale(.96); }
body.reduced .pill-in, body.reduced .delta-in { animation-name: fade; animation-duration:.12s; }
body.reduced .check-path { animation:none; stroke-dashoffset:0; }
body.reduced .summary-glow { animation:none; }
</style>
</head>
<body>
<div class="preview-bar">
  <strong>Preview</strong> Mark as paid, then Undo. Tab + Enter to try the keyboard path.
  <label><input type="checkbox" id="reduced" /> Simulate reduced motion</label>
  <button type="button" class="secondary" id="reset">Reset data</button>
</div>
<div class="app">
  <header class="topbar"><span class="brand">Folio</span>
    <nav aria-label="Main"><a href="#" aria-current="page">Invoices</a><a href="#">Clients</a><a href="#">Settings</a></nav>
  </header>
  <main class="page">
    <div class="page-head"><h1>Invoices</h1><button type="button" class="secondary">New invoice</button></div>
    <dl class="summary">
      <div><dt>Outstanding</dt><dd><span id="outstanding"></span></dd></div>
      <div class="summary-paid" id="paidCard"><dt>Paid</dt><dd><span id="paid"></span><span id="delta"></span></dd></div>
      <div><dt>Overdue</dt><dd><span id="overdue"></span></dd></div>
    </dl>
    <table class="invoices">
      <thead><tr><th scope="col">Invoice</th><th scope="col">Client</th><th scope="col">Project</th><th scope="col" class="num">Amount</th><th scope="col">Issued</th><th scope="col">Due</th><th scope="col">Status</th><th scope="col"><span class="visually-hidden">Actions</span></th></tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <p class="visually-hidden" role="status" id="live"></p>
  </main>
</div>
<script>
const seed = [
  ["FOL-2026-031","Vellumark Studio","Autumn catalogue cover",1450,"2026-09-01","2026-09-15","Paid"],
  ["FOL-2026-032","Quillfern Press","Picture book, 14 spreads",4200,"2026-09-03","2026-10-03","Overdue"],
  ["FOL-2026-033","Otterwick Coffee","Menu illustrations",680,"2026-09-08","2026-09-22","Overdue"],
  ["FOL-2026-034","Gullwhistle Outdoor","Trail map poster",1150,"2026-09-12","2026-10-12","Sent"],
  ["FOL-2026-035","The Lanternmoth Review","Editorial spot, October issue",320,"2026-09-18","2026-10-02","Paid"],
  ["FOL-2026-036","Fennico Tea","Tea packaging, three boxes",2400,"2026-09-24","2026-10-24","Sent"],
  ["FOL-2026-037","Hushwave Records","Album sleeve",950,"2026-10-01","2026-10-31","Sent"],
  ["FOL-2026-038","Vellumark Studio","Winter catalogue, six spots",1800,"2026-10-03","2026-10-31","Draft"],
];
const money = new Intl.NumberFormat("en-IE",{style:"currency",currency:"EUR"});
const day = new Intl.DateTimeFormat("en-GB",{day:"numeric",month:"short",year:"numeric"});
const fmtDate = iso => day.format(new Date(iso+"T12:00:00"));
let invoices, justPaid, keyboardPaid, timers;
const shown = {};
const reduced = () => document.getElementById("reduced").checked;
const UNDO_MS = 8000, DELAY = 150;

function reset(){
  invoices = seed.map(([id,client,project,amount,issued,due,status])=>({id,client,project,amount,issued,due,status}));
  justPaid = new Map(); keyboardPaid = new Set(); timers = new Map();
  render(null, true);
}
const check = animate => `<svg class="status-icon" viewBox="0 0 12 12" aria-hidden="true"><path ${animate?'class="check-path"':''} d="M2.5 6.4 4.9 8.7 9.5 3.6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const pill = (s, fresh) => `<span class="status status-${s.toLowerCase()} ${fresh?'pill-in':''}">${s==="Paid"?check(fresh):""}${s}</span>`;

function render(changedId, initial){
  const tbody = document.getElementById("rows");
  tbody.innerHTML = invoices.map(inv => {
    const restore = inv.status==="Paid" ? justPaid.get(inv.id) : undefined;
    const fresh = inv.id === changedId;
    const payable = inv.status==="Sent" || inv.status==="Overdue";
    const action = payable
      ? `<button type="button" data-pay="${inv.id}">Mark as paid</button>`
      : restore ? `<span class="undo-offer ${fresh?'fade-in':''}"><span class="undo-note">Paid just now</span><button type="button" class="link" data-undo="${inv.id}" aria-label="Undo marking ${inv.id} as paid">Undo</button></span>` : "";
    return `<tr class="${restore && fresh ? 'just-paid':''}"><td class="mono">${inv.id}</td><td>${inv.client}</td><td class="muted">${inv.project}</td><td class="num amount">${money.format(inv.amount)}</td><td>${fmtDate(inv.issued)}</td><td>${fmtDate(inv.due)}</td><td>${pill(inv.status, fresh)}</td><td class="actions">${action}</td></tr>`;
  }).join("");
  const sum = f => invoices.filter(f).reduce((a,i)=>a+i.amount,0);
  count("outstanding", sum(i=>i.status==="Sent"||i.status==="Overdue"), v=>money.format(v), initial);
  count("paid", sum(i=>i.status==="Paid"), v=>money.format(v), initial);
  count("overdue", invoices.filter(i=>i.status==="Overdue").length, v=>String(Math.round(v)), initial);
}

const running = {};
function count(id, to, fmt, initial){
  const el = document.getElementById(id);
  cancelAnimationFrame(running[id]);
  const from = shown[id] ?? to;
  if (initial || reduced() || from === to){ shown[id]=to; el.textContent = fmt(to); return; }
  const start = performance.now() + DELAY, dur = 700;
  const ease = t => 1 - Math.pow(1 - t, 4); // close to cubic-bezier(.16,1,.3,1)
  const step = now => {
    const t = Math.min(1, Math.max(0, (now - start) / dur));
    shown[id] = from + (to - from) * ease(t);
    el.textContent = fmt(Math.round(shown[id]*100)/100);
    if (t < 1) running[id] = requestAnimationFrame(step); else shown[id] = to;
  };
  running[id] = requestAnimationFrame(step);
}

let deltaTimer;
function land(amount){
  const card = document.getElementById("paidCard");
  card.querySelector(".summary-glow")?.remove();
  const glow = document.createElement("span"); glow.className="summary-glow"; glow.setAttribute("aria-hidden","true");
  card.prepend(glow);
  const d = document.getElementById("delta");
  d.innerHTML = `<span class="landed-delta delta-in" aria-hidden="true">+${money.format(amount)}</span>`;
  clearTimeout(deltaTimer); deltaTimer = setTimeout(()=>{ d.innerHTML=""; }, 2800);
}

function startUndoTimer(id, ms){
  clearTimeout(timers.get(id)?.t);
  const started = performance.now();
  timers.set(id, {t: setTimeout(()=>{ justPaid.delete(id); keyboardPaid.delete(id); timers.delete(id); render(null); }, ms), started, ms});
}

document.addEventListener("click", e => {
  const pay = e.target.closest("[data-pay]"), undo = e.target.closest("[data-undo]");
  if (pay){
    const inv = invoices.find(i=>i.id===pay.dataset.pay);
    const viaKeyboard = pay.matches(":focus-visible");
    justPaid.set(inv.id, inv.status); inv.status = "Paid";
    render(inv.id); land(inv.amount);
    document.getElementById("live").textContent = `${money.format(inv.amount)} from ${inv.client} received. ${inv.id} marked as paid.`;
    if (viaKeyboard){ keyboardPaid.add(inv.id); document.querySelector(`[data-undo="${inv.id}"]`)?.focus({preventScroll:true}); }
    else startUndoTimer(inv.id, UNDO_MS);
  }
  if (undo){
    const id = undo.dataset.undo, inv = invoices.find(i=>i.id===id);
    clearTimeout(timers.get(id)?.t); timers.delete(id);
    inv.status = justPaid.get(id); justPaid.delete(id); keyboardPaid.delete(id);
    document.getElementById("delta").innerHTML = "";
    render(id);
    document.getElementById("live").textContent = `${id} is back to ${inv.status.toLowerCase()}.`;
    document.querySelector(`[data-pay="${id}"]`)?.focus();
  }
});
// Pause the undo window while the Undo is hovered or focused; resume with at least 1.5s left.
const pause = e => { const b = e.target.closest?.("[data-undo]"); if(!b) return; const t = timers.get(b.dataset.undo); if(t){ clearTimeout(t.t); t.ms = Math.max(1500, t.ms - (performance.now()-t.started)); t.paused = true; } };
const resume = e => { const b = e.target.closest?.("[data-undo]"); if(!b) return; const id=b.dataset.undo; const t = timers.get(id); startUndoTimer(id, t ? t.ms : UNDO_MS); };
document.addEventListener("focusin", pause); document.addEventListener("mouseover", pause);
document.addEventListener("focusout", resume); document.addEventListener("mouseout", resume);
document.getElementById("reduced").addEventListener("change", e => document.body.classList.toggle("reduced", e.target.checked));
document.getElementById("reset").addEventListener("click", reset);
reset();
</script>
</body>
</html>
